# =============================================================================
# ApexOS add-on prebuilds — publish-addons (DRAFT, task #53 step 7).
#
# Builds every locally-buildable add-on in this repository and pushes
# PREBUILT images to the ApexOS registry:
#
#   registry.apexinfosys.in/apexos/{arch}-addon-<slug>:<version>
#
# The matching `image:` keys in each add-on's config point the Supervisor at
# these images — devices then PULL prebuilds from us instead of building
# locally (or pulling the upstream org's prebuilds).
#
# Conventions mirror the product repos' apexos-build.yml (docker-base):
#   * amd64 (self-hosted) + aarch64 (self-hosted (ARM64)), native arch;
#   * REGISTRY_USER / REGISTRY_PASSWORD org secrets (robot credential);
#   * push on main only; PRs just prove the builds.
# Differences (deliberate):
#   * no denylist image-gate — add-on payloads are third-party upstream
#     software (deCONZ, mosquitto, ...), not pipeline output; the gate's
#     0-violation contract applies to OUR base/product images only;
#   * an add-on leg auto-skips when the add-on doesn't support the arch or
#     its build.yaml has no build_from for it.
# =============================================================================
name: publish-addons

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-addons-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: registry.apexinfosys.in
  REGISTRY_NS: registry.apexinfosys.in/apexos

permissions:
  contents: read

jobs:
  # Third-party base images our add-ons build FROM are mirrored into the
  # org registry first — CI and devices never depend on external registries
  # at build/ship time (matter_server: ghcr.io/matter-js/matterjs-server).
  #
  # `docker buildx imagetools create`, NOT skopeo: skopeo only ever existed
  # here because the job used to run on a GitHub-hosted ubuntu image, which
  # preinstalls it. The self-hosted builders don't have it (exit 127,
  # "skopeo: command not found"), and installing it would mean mutating the
  # builder hosts. imagetools is the buildx-native equivalent — it copies the
  # whole manifest list registry-to-registry without pulling layers, so it is
  # both the `--all` equivalent and cheaper. Idempotent: re-tagging the same
  # digest is a no-op.
  mirror-bases:
    name: mirror third-party base images
    # main only. This job WRITES to the production registry, and every other
    # registry-writing job in the fleet (docker-base / addon-base `merge`,
    # every apexos-build.yml push step) is already gated the same way — this
    # one was the single outlier, so any pull request, from any branch, could
    # overwrite a shipped base tag. It also put a registry round-trip on the
    # critical path of every PR: the job `needs`-blocks all 36 build legs, so
    # while the builders are busy it just queues, and run 31578046462 sat
    # unassigned for 4m40s and died as `cancelled` — a red check on a PR that
    # changed nothing this job touches. Mirroring is idempotent and the tag
    # the add-on builds FROM is already published, so PRs lose no coverage.
    if: github.event_name != 'pull_request' && github.actor != 'dependabot[bot]'
    # Linux builder ONLY. The `apexos-builder` label is on BOTH self-hosted
    # runners, so a bare [self-hosted, apexos-builder] label set is a coin
    # flip between the Ubuntu box and the macOS workstation. This job is not
    # pure shell — it runs `docker buildx imagetools create` against the
    # registry, and only the Linux builder is provisioned for that — so which
    # runner happened to pick the job decided whether the mirror was
    # published at all. Same class as the fleet-wide template pins.
    runs-on: ${{ fromJSON(vars.APEXOS_RUNSON_AMD64 || '["self-hosted","apexos-builder","linux","X64"]') }}
    permissions:
      contents: read
      packages: read # refresh the shared runner's ghcr credential (below)
    steps:
      # imagetools reads the SOURCE ref from ghcr.io. That image is public and
      # needs no credential at all, but on a self-hosted runner
      # ~/.docker/config.json is SHARED by every job of every repo, and a
      # GITHUB_TOKEN dies with the job that minted it. A leftover ghcr entry
      # therefore makes the read present an EXPIRED credential, and ghcr
      # answers 403 rather than falling back to anonymous (proven live: run
      # 31544148412 — `failed to fetch oauth token: ... 403 Forbidden` on
      # `scope=repository:matter-js/matterjs-server:pull`). The login in the
      # step below is for OUR registry and never touches the ghcr entry.
      # Hosted runners never showed this: each job got a fresh VM.
      - name: refresh ghcr credential
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: mirror matterjs-server
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          # Hard failure, not a warning-and-skip. matter_server's build.yaml
          # resolves build_from to $REGISTRY_NS/matterjs-server, so a silent
          # skip here leaves the job green while nothing is mirrored, and the
          # miss only surfaces later as an unresolvable base. Matches the
          # `push to registry` step below.
          if [ -z "$REGISTRY_PASSWORD" ]; then
            echo "::error::REGISTRY_PASSWORD not set — cannot mirror the base image"
            exit 1
          fi
          echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin
          docker buildx imagetools create \
            --tag "$REGISTRY_NS/matterjs-server:1.2.6" \
            ghcr.io/matter-js/matterjs-server:1.2.6

      # The other half of the `refresh ghcr credential` step above. That step
      # exists because a previous job left an expired ghcr entry in this shared
      # home and the read then failed 403 instead of going anonymous; refreshing
      # fixes the symptom for THIS job while handing the same expired entry to
      # the next one. Removing it here is what ends the cycle. Matches the step
      # of the same name in every apexos-build.yml.
      #
      # always() so a failed mirror does not skip the cleanup, and never fail the
      # job on it: `docker logout` already exits 0 for a registry that was never
      # logged into, so a nonzero here would only mask the real result.
      - name: drop the registry credentials from the shared runner home
        if: always()
        run: |
          docker logout ghcr.io || true
          docker logout "$REGISTRY" || true

  build:
    name: ${{ matrix.addon }} (${{ matrix.arch.name }})
    needs: mirror-bases
    # mirror-bases is main-only now, so on a pull request it is SKIPPED — and
    # a skipped `needs` skips its dependents unless the condition tolerates
    # it, which would silently stop PRs from proving the builds at all. Keep
    # the real gate: never build on top of a mirror that actually FAILED.
    if: >-
      !cancelled() && needs.mirror-bases.result != 'failure'
      && github.actor != 'dependabot[bot]'
    runs-on: ${{ matrix.arch.runner }}
    permissions:
      contents: read
      packages: read # the add-on bases are ghcr.io/apexinfosysindia/*
    strategy:
      fail-fast: false
      matrix:
        arch:
          - name: amd64
            runner: ${{ fromJSON(vars.APEXOS_RUNSON_AMD64 || '["self-hosted","apexos-builder","linux","X64"]') }}
          - name: aarch64
            runner: ${{ fromJSON(vars.APEXOS_RUNSON_AARCH64 || '["self-hosted","apexos-builder","ARM64"]') }}
        addon:
          - aircast
          - apex-cloud-link
          - autossh
          - cec_scan
          - configurator
          - matter_server
          - mosquitto
          - openthread_border_router
          - openwakeword
          - piper
          - plex
          - samba
          - speech_to_phrase
          - spotify
          - ssh
          - vscode
          - whisper
          - zigbee2mqtt
    env:
      ADDON: ${{ matrix.addon }}
      ARCH: ${{ matrix.arch.name }}
    steps:
      # The self-hosted builders share ONE disk across every job of every repo,
      # and this workflow is the heaviest thing on it: 36 add-on images, several
      # of which pip-install torch. On 2026-08-12 the amd64 builder reached zero
      # bytes free and ten add-on builds died with errno 28 ("No space left on
      # device") mid pip-install, alongside core's apexos-build. Hosted runners
      # never showed this because every job got a fresh disk.
      #
      # Trim only when the disk is actually tight, so a warm cache survives the
      # common case. `df -Pk` because the ARM64 builder is macOS, where df has
      # neither -BG nor --output.
      - name: reclaim disk when the shared builder is low
        run: |
          free_gb=$(df -Pk . | awk 'NR==2 {print int($4 / 1048576)}')
          echo "free before: $free_gb GiB"
          docker system df || true
          if [ "$free_gb" -lt 20 ]; then
            docker image prune -f || true
            docker buildx prune -f --keep-storage=10GB \
              || docker builder prune -f --keep-storage=10GB || true
            # Tagged build products pile up too (every leg tags and pushes an
            # image), and dangling-only pruning never touches them. Sweep the
            # unused ones older than a week -- on the LINUX builder only: the
            # ARM64 builder is a workstation with its own images and stopped
            # containers, and `prune -a` there would sweep things this pipeline
            # does not own.
            if [ "$(uname)" = "Linux" ]; then
              docker image prune -a -f --filter until=168h || true
            fi
            df -Ph .
          fi

      - name: checkout addons
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The metadata step below needs PyYAML. Plain `python3` is NOT enough:
      # on the ARM64 builder /usr/bin/python3 is 3.9.6 with no yaml at all,
      # so every aarch64 leg would die on `import yaml`. And no
      # actions/setup-python — on that (macOS) builder its fallback installer
      # resolves the tool cache from the hosted-image path
      # /Users/runner/hostedtoolcache and dies on
      # `mkdir: /Users/runner: Permission denied`.
      #
      # Probe the runner's own interpreters for one that can already import
      # yaml, and expose it as an unversioned `python`. The Linux builder
      # ships python3.12 WITH PyYAML but WITHOUT pip and WITHOUT ensurepip,
      # so venv/pip recovery is only a last resort there.
      # Every base this repo builds FROM lives behind a credential: most
      # add-ons use ghcr.io/apexinfosysindia/{base,base-debian,addon-base},
      # matter_server uses the mirror in our own registry. See the note on
      # mirror-bases for why the ghcr entry in the SHARED docker config has to
      # be overwritten per job rather than trusted -- an expired entry there
      # turns an otherwise anonymous pull into a 403. The registry login is
      # advisory: `push to registry` logs in again on main, and an add-on whose
      # base is not behind the org registry builds fine without it.
      - name: refresh base-image credentials (ghcr + org registry)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if [ -n "$REGISTRY_PASSWORD" ]; then
            echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin
          else
            echo "::warning::REGISTRY_PASSWORD not set — bases hosted in the org registry will not resolve"
          fi

      - name: provision python + yaml (runner-native interpreter)
        run: |
          set -eu
          py=""
          cand=""
          for c in python3.12 python3.13 python3.11 python3 python; do
            p=$(command -v "$c" 2>/dev/null) || continue
            if [ -z "$cand" ]; then cand="$p"; fi
            if "$p" -c 'import yaml' 2>/dev/null; then py="$p"; break; fi
          done
          if [ -z "$py" ]; then
            if [ -z "$cand" ]; then echo "no python3 on this runner" >&2; exit 1; fi
            py="$cand"
            venv="$RUNNER_TEMP/addonvenv"
            if "$py" -m venv "$venv" 2>/dev/null && "$venv/bin/python" -m pip --version >/dev/null 2>&1; then
              "$venv/bin/python" -m pip install -q --disable-pip-version-check pyyaml
              py="$venv/bin/python"
            elif "$py" -m pip install -q --user --break-system-packages pyyaml 2>/dev/null; then
              :
            else
              "$py" -m pip install -q --user pyyaml
            fi
          fi
          "$py" -c 'import sys, yaml; print(sys.version, "pyyaml", yaml.__version__)'
          shim="$RUNNER_TEMP/pyshim"
          mkdir -p "$shim"
          ln -sf "$py" "$shim/python"
          echo "$shim" >> "$GITHUB_PATH"

      - name: read add-on metadata (config + build.yaml)
        id: meta
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import pathlib

          import yaml

          addon = os.environ["ADDON"]
          arch = os.environ["ARCH"]
          root = pathlib.Path(".")

          def load(p):
              if p.suffix == ".json":
                  return json.loads(p.read_text())
              return yaml.safe_load(p.read_text())

          cfg = None
          for name in ("config.yaml", "config.json"):
              p = root / addon / name
              if p.is_file():
                  cfg = load(p)
                  break
          assert cfg, f"no config for {addon}"

          supported = arch in cfg.get("arch", [])

          # build_from: add-on build.yaml, else the store root build.yaml
          build_from = ""
          args = {}
          for p in (root / addon / "build.yaml", root / "build.yaml"):
              if p.is_file():
                  b = load(p) or {}
                  bf = b.get("build_from") or {}
                  if isinstance(bf, str):
                      build_from = bf
                  else:
                      build_from = bf.get(arch, "")
                  args = b.get("args") or {}
                  break
          if not build_from:
              supported = False

          print(f"supported={'true' if supported else 'false'}")
          print(f"slug={cfg['slug']}")
          print(f"version={cfg['version']}")
          print(f"build_from={build_from}")
          print("build_args=" + " ".join(f"{k}={v}" for k, v in args.items()))
          PY

      - name: build ${{ matrix.addon }} (${{ matrix.arch.name }})
        if: steps.meta.outputs.supported == 'true'
        env:
          BUILD_FROM: ${{ steps.meta.outputs.build_from }}
          BUILD_ARGS: ${{ steps.meta.outputs.build_args }}
          VERSION: ${{ steps.meta.outputs.version }}
          SLUG: ${{ steps.meta.outputs.slug }}
        run: |
          extra=()
          for a in $BUILD_ARGS; do extra+=(--build-arg "$a"); done
          docker buildx build --load "$ADDON" \
            --build-arg "BUILD_FROM=$BUILD_FROM" \
            --build-arg "BUILD_ARCH=$ARCH" \
            --build-arg "BUILD_VERSION=$VERSION" \
            "${extra[@]}" \
            --label "io.apexos.arch=$ARCH" \
            -t "$REGISTRY_NS/$ARCH-addon-$SLUG:$VERSION"

      - name: push to registry (main only)
        if: steps.meta.outputs.supported == 'true' && github.event_name != 'pull_request'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          SLUG: ${{ steps.meta.outputs.slug }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          if [ -z "$REGISTRY_PASSWORD" ]; then
            echo "::error::REGISTRY_PASSWORD not set"
            exit 1
          fi
          echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin
          docker push "$REGISTRY_NS/$ARCH-addon-$SLUG:$VERSION"

      # See the identical step in `mirror-bases` above. This job matters more for
      # it: its aarch64 leg runs on the macOS builder, which is also the OS image
      # builder and the iOS CI runner, so the credential it leaves behind is
      # offered to a much wider set of unrelated jobs. Unconditional, unlike the
      # push step, because the login on a PR run happens in the base-image
      # refresh step, which is not gated on `main`.
      - name: drop the registry credentials from the shared runner home
        if: always()
        run: |
          docker logout ghcr.io || true
          docker logout "$REGISTRY" || true

  addons-published:
    name: addons-published
    needs: build
    if: always() && github.actor != 'dependabot[bot]'
    runs-on: ${{ fromJSON(vars.APEXOS_RUNSON_AMD64 || '["self-hosted","apexos-builder","linux","X64"]') }}
    steps:
      - name: assert every supported add-on/arch built (and pushed on main)
        env:
          RESULT: ${{ needs.build.result }}
        run: |
          echo "build matrix result: $RESULT"
          test "$RESULT" = "success"
